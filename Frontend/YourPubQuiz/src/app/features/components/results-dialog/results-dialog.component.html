<p-dialog
  header="Results: {{quizResult.correctAnswers}}/{{quizResult.totalQuestions}} Correct"
  [(visible)]="showResults"
  [style]="{ width: 'w-2/4'}">
  <p-table [value]="quizResult.questionResults">
    <ng-template #header>
      <tr>
        <th>Question</th>
        <th>Correct</th>
        <th>Your answer</th>
        <th>Correct answer</th>
      </tr>
    </ng-template>
    <ng-template let-questionResult pTemplate="body">
      <tr>
        <td>
          {{ questionResult.questionText }}
        </td>
        <td>
          @if (questionResult.isCorrect){
            <span class="pi pi-verified" style="color: darkgreen"></span>
          }
          @else {
            <span class="pi pi-times-circle" style="color: darkred"></span>
          }
        </td>
        <td>
          {{ questionResult.userAnswer }}
        </td>
        <td>
          {{ questionResult.isCorrect ? '' : questionResult.correctAnswer }}
        </td>
      </tr>
    </ng-template>
  </p-table>
    <div class="flex justify-end m-4">
      <p-button label="Close results" (click)="closeDialog()"/>
    </div>
</p-dialog>
